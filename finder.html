ratio."}, {"slug": "meeting-cost-calculator", "name": "Meeting Cost Calculator", "cat": "Operations & Workflow", "sub": "work", "desc": "See what a meeting really costs in salaried time."}, {"slug": "word-counter", "name": "Word & Character Counter", "cat": "Operations & Workflow", "sub": "writing", "desc": "Count words, characters, sentences and reading time."}, {"slug": "survey-sample-size-calculator", "name": "Survey Sample Size Calculator", "cat": "Operations & Workflow", "sub": "sop", "desc": "How many people to survey for results you can trust."}, {"slug": "qr-code-generator", "name": "QR Code Generator", "cat": "Operations & Workflow", "sub": "ecomops", "desc": "Create a QR code and download it free as PNG or SVG."}, {"slug": "nps-calculator", "name": "NPS Calculator", "cat": "Communication & Voice", "sub": "chat", "desc": "Measure customer loyalty from your survey responses."}, {"slug": "password-generator", "name": "Strong Password Generator", "cat": "IT & Productivity", "sub": "security", "desc": "Generate a strong, random password locally in your browser."}, {"slug": "favicon-generator", "name": "Favicon Generator", "cat": "IT & Productivity", "sub": "hosting", "desc": "Make a favicon from a letter or emoji with your colours."}, {"slug": "image-compressor", "name": "Image Compressor", "cat": "IT & Productivity", "sub": "hosting", "desc": "Shrink JPG/PNG file sizes in your browser for faster pages."}, {"slug": "color-palette-generator", "name": "Colour Palette Generator", "cat": "IT & Productivity", "sub": "prodtools", "desc": "Build a matching colour palette from one base colour."}];
  var state = {cat: null, sub: null};
  var root = document.getElementById('finder');

  function h(html){ var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
  function track(ev, params){ try{ if(window.gtag) gtag('event', ev, params || {}); }catch(e){} }

  function step1(){
    var keys = Object.keys(CATS);
    render('<p class="f-q">What part of your business needs help?</p>', keys.map(function(c){
      return btn(CATS[c].label, function(){ state.cat = c; step2(); });
    }));
  }
  function step2(){
    var cat = CATS[state.cat];
    render('<p class="f-q">' + cat.q + '</p>', cat.subs.map(function(s){
      return btn(s[1], function(){ state.sub = s[0]; results(); });
    }).concat([back(step1)]));
  }
  function score(t){
    var s = 0;
    if (t.cat === state.cat) s += 4;
    if (t.sub === state.sub) s += 6;
    if (t.hands) s += 2;
    if (t.feat && t.sub === state.sub) s += 6;
    return s;
  }
  function results(){
    var ranked = DATA.map(function(t){ return [score(t), t]; })
      .filter(function(x){ return x[0] >= 4; })
      .sort(function(a, b){ return b[0] - a[0]; });
    var top = ranked.slice(0, 3).map(function(x){ return x[1]; });
    track('finder_result', {finder_cat: state.cat, finder_sub: state.sub, finder_top: top.length ? top[0].name : 'none'});
    var cards = top.map(function(t, i){
      var badge = i === 0 ? '<span class="f-best">Best match</span>' : '';
      var hands = t.hands ? '<a class="f-hands" href="' + t.hands + '">Read my hands-on review →</a>' : '';
      var why = (t.sub === state.sub ? 'Exactly built for this. ' : 'Strong fit in this category. ') + (t.hands ? 'I use or have personally tested it.' : '');
      return h('<div class="f-card">' + badge +
        '<div class="f-head"><img loading="lazy" src="https://www.google.com/s2/favicons?domain=' + t.domain + '&sz=64" alt="">' +
        '<strong>' + t.name + '</strong></div>' +
        '<p class="f-desc">' + t.desc + '</p>' +
        '<p class="f-why">' + why + '</p>' +
        '<div class="f-row"><a class="f-cta" href="' + t.link + '" target="_blank" rel="sponsored noopener">Visit ' + t.name + ' →</a>' + hands + '</div>' +
        '</div>');
    });
    if (!cards.length){ cards = [h('<p class="f-desc">No direct match — browse the full directory below.</p>')]; }
    var ftM = FREE.filter(function(f){ return f.cat === state.cat; });
    var ftS = ftM.filter(function(f){ return f.sub === state.sub; });
    var ft = ftS[0] || ftM[0];
    var ftNode = ft ? [h('<div class="f-card"><span class="f-best" style="background:#3b82f6">Free tool</span>' +
      '<div class="f-head"><strong>' + ft.name + '</strong></div>' +
      '<p class="f-desc">' + ft.desc + '</p>' +
      '<div class="f-row"><a class="f-cta" href="https://aibuildermarketplace.com/tools/' + ft.slug + '/" target="_blank" rel="nofollow noopener">Open free tool &rarr;</a></div></div>')] : [];
    render('<p class="f-q">My recommendation' + (cards.length > 1 ? 's' : '') + ':</p>', cards.concat(ftNode).concat([
      h('<div class="f-row" style="margin-top:14px"><a class="f-alt" href="/">Browse the full directory →</a></div>'),
      back(step1, 'Start over')
    ]));
  }
  function btn(label, fn){ var b = h('<button class="f-btn">' + label + '</button>'); b.addEventListener('click', fn); return b; }
  function back(fn, label){ var b = h('<button class="f-back">' + (label || '← Back') + '</button>'); b.addEventListener('click', fn); return b; }
  function render(qhtml, nodes){
    root.innerHTML = qhtml;
    var wrap = h('<div class="f-opts"></div>');
    nodes.forEach(function(n){ wrap.appendChild(n); });
    root.appendChild(wrap);
  }
  step1();
})();

  </script>
